<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fazendo Massa!</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{background:#6ccaff;font-family:system-ui,-apple-system,sans-serif;cursor:pointer;position:relative}
.sun{position:absolute;top:6%;right:9%;width:15vmin;height:15vmin;border-radius:50%;background:#ffe14d;box-shadow:0 0 0 2vmin rgba(255,225,77,.35),0 0 8vmin #ffe14d;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.cloud{position:absolute;width:22vmin;height:7vmin;background:#fff;border-radius:10vmin;animation:drift linear infinite}
.cloud::before{content:'';position:absolute;width:9vmin;height:9vmin;background:#fff;border-radius:50%;top:-4.5vmin;left:3vmin}
.cloud::after{content:'';position:absolute;width:11vmin;height:11vmin;background:#fff;border-radius:50%;top:-6vmin;left:8vmin}
@keyframes drift{from{transform:translateX(-30vmin)}to{transform:translateX(calc(100vw + 30vmin))}}
#crane{position:absolute;right:3%;bottom:31%;height:52vh;opacity:.95}
#crane .hook{animation:swing 3s ease-in-out infinite;transform-box:view-box;transform-origin:40px 52px}
@keyframes swing{50%{transform:rotate(4deg)}}
#ground{position:absolute;left:0;right:0;bottom:0;height:34%;background:#d9a35b;border-top:1.2vmin solid #b98040}
#ground::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 40%,#c48d48 0 1vmin,transparent 1.2vmin),radial-gradient(circle at 70% 30%,#c48d48 0 .8vmin,transparent 1vmin),radial-gradient(circle at 45% 60%,#c48d48 0 .7vmin,transparent .9vmin);background-size:18vmin 14vmin}
#road{position:absolute;left:0;right:0;bottom:0;height:12%;background:#555;border-top:.8vmin solid #333}
#road::after{content:'';position:absolute;left:0;right:0;top:45%;height:1.2vmin;background:repeating-linear-gradient(90deg,#ffd21f 0 7vmin,transparent 7vmin 14vmin)}
#site{position:absolute;left:50%;bottom:12.5%;transform:translateX(-50%);display:flex;align-items:flex-end;z-index:2;--m:max(44vmin,min(60vw,30vh))}
#mixer{width:var(--m);display:block;overflow:visible;transition:filter .2s}
#mixer.glow{filter:drop-shadow(0 0 2vmin #fff36b) drop-shadow(0 0 1vmin #ffd21f)}
#mixer.near{filter:drop-shadow(0 0 3.5vmin #fff36b) drop-shadow(0 0 2vmin #ff8c1a)}
#barrow{width:calc(var(--m)*.68);margin-left:calc(var(--m)*-.34);display:block;position:relative;z-index:3}
#drum{transform-box:view-box;transform-origin:100px 105px;transition:transform .6s cubic-bezier(.5,1.6,.6,1)}
#drum.tilt{transform:rotate(80deg)}
#heap{transform-box:view-box;transform-origin:100px 52px;transform:scaleY(0);transition:transform .9s cubic-bezier(.4,1.6,.6,1)}
.stripes{animation:roll 1.6s linear infinite}
@keyframes roll{to{transform:translateX(40px)}}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .45s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.track{animation:trackmove .4s linear infinite}
@keyframes trackmove{to{stroke-dashoffset:-24}}
.arm{transform-box:view-box;transform-origin:205px 95px;animation:dig 1.4s ease-in-out infinite alternate}
@keyframes dig{to{transform:rotate(-10deg)}}
.item{position:absolute;--it:min(20vmin,170px);width:var(--it);height:var(--it);margin:calc(var(--it)/-2) 0 0 calc(var(--it)/-2);z-index:5;pointer-events:none}
.item svg{width:100%;height:100%;filter:drop-shadow(0 .6vmin .4vmin rgba(0,0,0,.25));pointer-events:none}
.item.grab{pointer-events:auto;cursor:grab;transition:opacity .3s}
.item.grab.off{opacity:.45}
.item.held{z-index:8}
.item.held svg{filter:drop-shadow(0 3vmin 1.5vmin rgba(0,0,0,.3))}
.item .ring{position:absolute;inset:-1.5vmin;border-radius:50%;border:1vmin dashed rgba(255,255,255,.9);animation:spin 6s linear infinite;opacity:0;transition:opacity .2s;pointer-events:none}
.item.held .ring{opacity:1;animation-duration:1.5s}
.bob{width:100%;height:100%;animation:wig 1.1s ease-in-out infinite alternate;pointer-events:none}
.item.held .bob{animation-duration:.18s}
@keyframes wig{from{transform:rotate(-5deg) translateY(0)}to{transform:rotate(5deg) translateY(-1.2vmin)}}
.particle{position:absolute;border-radius:50%;z-index:4;pointer-events:none}
.machine{position:absolute;left:0;bottom:1.5%;width:62vmin;z-index:4;pointer-events:none}
.machine svg{width:100%;display:block;animation:bob .3s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-.6vmin)}}
.star{position:absolute;font-size:9vmin;z-index:6;pointer-events:none;margin:-5vmin 0 0 -5vmin}
.hand{position:absolute;font-size:13vmin;z-index:9;pointer-events:none;margin:-2vmin 0 0 -5vmin;filter:drop-shadow(0 .6vmin .6vmin rgba(0,0,0,.3))}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
#prog{position:absolute;top:3vmin;left:50%;transform:translateX(-50%);display:flex;gap:1.6vmin;z-index:7;background:rgba(255,255,255,.85);padding:1.4vmin 2vmin;border-radius:6vmin}
#prog:empty{display:none}
#prog span{width:4.6vmin;height:4.6vmin;border-radius:50%;background:#dfe9ef;border:.5vmin solid #b8c7d1;transition:background .3s,transform .3s}
#prog span.on{transform:scale(1.2)}
#home{position:absolute;top:2.5vmin;left:2.5vmin;width:12vmin;height:12vmin;border-radius:50%;z-index:20;display:none;align-items:center;justify-content:center;font-size:6vmin;background:conic-gradient(#ff8c1a var(--p,0%),rgba(255,255,255,.6) 0);box-shadow:0 .6vmin 0 rgba(0,0,0,.15)}
#home::before{content:'';position:absolute;inset:1.2vmin;border-radius:50%;background:#fff}
#home span{position:relative}
#menu{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vmin;background:rgba(108,202,255,.93);padding:4vmin}
#menu h1{font-size:10vmin;font-weight:900;color:#fff;text-align:center;text-shadow:0 .8vmin 0 #ff8c1a,0 1.6vmin 2vmin rgba(0,0,0,.2)}
#cards{display:flex;flex-wrap:wrap;gap:5vmin;justify-content:center}
.card{width:min(42vmax,80vw);max-width:62vmin;background:#fff;border-radius:5vmin;border:1.4vmin solid #ff8c1a;box-shadow:0 1.6vmin 0 #c45f00;padding:3vmin;display:flex;flex-direction:column;align-items:center;gap:1.5vmin;animation:pulse 2s ease-in-out infinite}
.card:nth-child(2){border-color:#2ca24a;box-shadow:0 1.6vmin 0 #1d7a35;animation-delay:-1s}
.card .pic{position:relative;width:100%;display:flex;justify-content:center;align-items:flex-end;height:22vmin}
.card .pic svg{height:100%}
.card .emo{position:absolute;right:4%;top:0;font-size:10vmin}
.card b{font-size:6vmin;color:#444;text-align:center}

.scene{position:absolute;inset:0;display:none;overflow:hidden}
.scene.on{display:block}
#sObra{background:linear-gradient(#6ccaff 0%,#c4ecff 65%)}
#cards{display:flex;flex-wrap:wrap;gap:3.5vmin;justify-content:center;max-width:100%}
.card{width:38vmin;max-width:none;padding:2.2vmin;border-width:1.1vmin;border-radius:4vmin;gap:1vmin}
.card:nth-child(3){border-color:#2c5aa0;box-shadow:0 1.6vmin 0 #1d3f73;animation-delay:-.5s}
.card:nth-child(4){border-color:#e63b2e;box-shadow:0 1.6vmin 0 #a8241a;animation-delay:-1.5s}
.card .pic{height:15vmin}
.card .emo{font-size:7vmin}
.card b{font-size:4.4vmin}
.card .pic{overflow:hidden}
.card .bigemo{font-size:8.5vmin;line-height:15vmin;white-space:nowrap}
#menu h1{font-size:8vmin}
#ver{position:absolute;bottom:2.5vmin;left:0;right:0;text-align:center;color:#fff;font-weight:700;font-size:3.2vmin;opacity:.9}
#upd{position:absolute;top:3vmin;left:50%;transform:translateX(-50%);z-index:40;display:none;align-items:center;gap:2.5vmin;background:#1f2937;color:#fff;border-radius:3vmin;padding:2vmin 2.5vmin 2vmin 3.5vmin;font-size:3.4vmin;font-weight:700;box-shadow:0 1.5vmin 4vmin rgba(0,0,0,.3);white-space:nowrap;animation:drop .5s cubic-bezier(.4,1.6,.6,1)}
#upd button{font:inherit;border:0;border-radius:2vmin;padding:1.6vmin 3vmin;background:#ff8c1a;color:#fff;font-weight:900;cursor:pointer}
@keyframes drop{from{transform:translate(-50%,-150%)}}
/* animais */
.prop{position:absolute;transform:translate(-50%,-100%);pointer-events:none}
.prop svg{width:100%;display:block}
.animal{position:absolute;transform:translate(-50%,-100%);line-height:1;cursor:pointer;filter:drop-shadow(0 .8vmin .5vmin rgba(0,0,0,.25))}
.animal span{display:inline-block;animation:breathe 2.6s ease-in-out infinite;transform-origin:50% 100%}
.animal.swim span{animation:swim 4s ease-in-out infinite}
.animal.found::after{content:'✔';position:absolute;right:-1vmin;top:-1vmin;font-size:4.5vmin;width:6vmin;height:6vmin;line-height:6vmin;text-align:center;border-radius:50%;background:#2ca24a;color:#fff;font-weight:900;filter:none}
@keyframes breathe{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.08,.93)}90%{transform:scale(.96,1.06) translateY(-1.5vmin)}}
@keyframes swim{0%,100%{transform:translate(0,0)}50%{transform:translate(-3vmin,-1.5vmin)}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.bubble{position:absolute;border-radius:50%;border:.4vmin solid rgba(255,255,255,.7);pointer-events:none;animation:rise linear infinite}
@keyframes rise{from{transform:translateY(0);opacity:0}10%{opacity:1}to{transform:translateY(-70vh);opacity:0}}
#atrack{position:absolute;top:2.5vmin;left:50%;transform:translateX(-50%);z-index:7;display:none;gap:1vmin;background:rgba(255,255,255,.88);padding:1vmin 2.4vmin;border-radius:6vmin;font-size:6vmin;line-height:1.2}
#atrack span{transition:filter .4s,transform .4s}
#atrack span.nf{filter:brightness(0) opacity(.3)}
#atrack span.ok{transform:scale(1.15)}
#home{z-index:28}
#big{position:absolute;inset:0;z-index:25;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.35)}
#big .rays{position:absolute;width:150vmax;height:150vmax;left:50%;top:50%;margin:-75vmax 0 0 -75vmax;background:repeating-conic-gradient(rgba(255,255,255,.18) 0 10deg,transparent 10deg 20deg);animation:spin 14s linear infinite;pointer-events:none}
#bigE{position:relative;font-size:46vmin;line-height:1;filter:drop-shadow(0 2vmin 2vmin rgba(0,0,0,.35))}
#bigN{position:relative;margin-top:2vmin;font-size:12vmin;font-weight:900;color:#fff;letter-spacing:.5vmin;text-shadow:0 .9vmin 0 #ff8c1a,0 0 3vmin rgba(0,0,0,.4)}
#banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:9;font-size:13vmin;font-weight:900;color:#fff;text-shadow:0 1vmin 0 #ff8c1a,0 0 4vmin rgba(0,0,0,.3);pointer-events:none;white-space:nowrap}
#nextBtn{position:absolute;right:4vmin;bottom:4vmin;z-index:26;width:22vmin;height:22vmin;border-radius:50%;background:#ff8c1a;color:#fff;font-size:13vmin;display:none;align-items:center;justify-content:center;box-shadow:0 1.6vmin 0 #c45f00;animation:pulse 1s ease-in-out infinite}
/* percurso */
#sCourse{background:linear-gradient(#6ccaff 0,#c4ecff 15%,#cf9a55 15%,#d9a35b 100%)}
#roadSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cm{position:absolute;left:0;top:0;cursor:pointer}
.cm svg{width:100%;display:block;pointer-events:none}
.cm:not(.moving) *{animation-play-state:paused!important}
.cm.moving svg{animation:bob .3s ease-in-out infinite alternate}

/* menu com 7 jogos */
#menu{padding:2vmin;gap:3vmin}
#menu h1{font-size:7vmin}
#cards{gap:2.5vmin}
.card{width:29vmin;padding:1.8vmin;gap:.8vmin}
.card .pic{height:11vmin}
.card .emo{font-size:6vmin}
.card b{font-size:3.6vmin}
.card .bigemo{font-size:7vmin;line-height:11vmin}
.card[style*="--c"]{border-color:var(--c);box-shadow:0 1.6vmin 0 var(--d)}
@media (orientation:landscape){.card{width:min(29vmin,calc((100vw - 18vmin)/4))}#cards{max-width:124vmin}}
/* prédio */
#sPredio{background:linear-gradient(#6ccaff 0,#c4ecff 40%,#d9a35b 40%,#c48d48 100%)}
.pm{position:absolute;left:0;top:0;cursor:pointer}
.pm svg{width:100%;display:block;pointer-events:none}
.pm:not(.moving):not(.dig) *{animation-play-state:paused!important}
.pm.dig .wheel,.pm.dig .track{animation-play-state:paused!important}
.pm.dig .arm{animation-duration:.45s!important}
.pm.pour .stripes{animation-play-state:running!important;animation-duration:.3s!important}
.pm.moving svg{animation:bob .3s ease-in-out infinite alternate}
.pm.act,.bp.crane.act{animation:actglow 1s ease-in-out infinite}
@keyframes actglow{50%{filter:drop-shadow(0 0 2vmin #fff36b) drop-shadow(0 0 1vmin #ff8c1a) brightness(1.1)}}
.parrow{font-size:9vmin;transform:translate(-50%,-110%);animation:arrowbob .6s ease-in-out infinite alternate}
@keyframes arrowbob{to{margin-top:-2.5vmin}}
.bp{position:absolute;pointer-events:none}
.bp svg{width:100%;display:block}
.hole{transform:translate(-50%,-50%) scale(0);border-radius:50%;background:radial-gradient(#3a2410,#5a3a1a 70%);transition:transform 2.2s ease-out;z-index:1}
.hole.on{transform:translate(-50%,-50%) scale(1)}
.pile{transform:translate(-50%,-100%) scale(0);transition:transform 1.4s ease-out}
.pile.on{transform:translate(-50%,-100%) scale(1)}
.flat{background:repeating-linear-gradient(90deg,#9a7a52 0 2vmin,#8a6a44 2vmin 4vmin);border-radius:1vmin;transform:scaleX(0);transform-origin:left;transition:transform 1.7s linear;z-index:1}
.flat.on{transform:scaleX(1)}
.found{background:#a5a5a5;border:.4vmin solid #7a7a7a;transform:scaleY(0);transform-origin:bottom;transition:transform 2s ease-out}
.found.on{transform:scaleY(1)}
.fcol{position:absolute;bottom:0;width:8%;height:100%;background:#a5a5a5;border:.3vmin solid #7a7a7a;transform:scaleY(0);transform-origin:bottom;transition:transform .7s ease-out}
.fslab{position:absolute;left:-3%;right:-3%;top:0;height:12%;background:#b5b5b5;border:.3vmin solid #7a7a7a;transform:scaleX(0);transition:transform .5s ease-out .6s}
.fwall{position:absolute;left:4%;right:4%;top:10%;bottom:0;opacity:0;display:flex;justify-content:space-around;align-items:center;transition:opacity .6s 1s}
.fwall i{width:20%;height:50%;background:#7cc4ff;border:.6vmin solid #fff;border-radius:.6vmin;transition:background .3s,box-shadow .3s}
.fwall i.lit{background:#fff36b;box-shadow:0 0 3vmin #fff36b}
.floor.on .fcol{transform:scaleY(1)}.floor.on .fslab{transform:scaleX(1)}.floor.on .fwall{opacity:1}
.roof{clip-path:polygon(50% 0,100% 100%,0 100%);-webkit-clip-path:polygon(50% 0,100% 100%,0 100%);background:linear-gradient(#e2574c,#c0392b)}
.rope{background:#444}.trolley{background:#555;border-radius:.5vmin}
.bucket{transform-origin:50% 20%}
.pstream{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
#sPredio.inst *{transition:none!important}
/* lava-jato */
#sWash{background:linear-gradient(90deg,transparent calc(100% - .4vmin),#a9d8f5 0) 0 0/9vmin 9vmin,linear-gradient(transparent calc(100% - .4vmin),#a9d8f5 0) 0 0/9vmin 9vmin,#e3f5ff}
.wfloor{position:absolute;left:0;right:0;bottom:0;background:repeating-linear-gradient(90deg,#8e9aa3 0 12vmin,#86929b 12vmin 24vmin);border-top:1vmin solid #6f7b84}
.wpost{position:absolute;top:6%;bottom:18%;width:4vmin;background:#2c7be5;border-radius:1vmin}
.wbeam{position:absolute;top:6%;left:3%;right:3%;height:8vmin;background:#2c7be5;border-radius:1.5vmin;color:#fff;font-weight:900;font-size:5vmin;display:flex;align-items:center;justify-content:center;letter-spacing:1vmin}
.drop{position:absolute;top:calc(6% + 8vmin);width:1.2vmin;height:2.4vmin;border-radius:50%/60% 60% 40% 40%;background:#4aa8ff;animation:dropfall linear infinite;opacity:.7}
@keyframes dropfall{from{transform:translateY(0)}to{transform:translateY(55vh);opacity:0}}
.wcar{position:absolute;z-index:3}
.wcar svg{width:100%;display:block}
.wcar:not(.moving) *{animation-play-state:paused!important}
.wcar.moving svg{animation:bob .3s ease-in-out infinite alternate}
.mud{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.sponge{position:absolute;font-size:12vmin;z-index:31;pointer-events:none;transform:translate(-50%,-50%);display:none}
/* pintar */
#sPaint{background:linear-gradient(#fff6e0 0,#ffe9c2 70%)}
.pfloor{position:absolute;left:0;right:0;bottom:0;height:30%;background:#d9c8a8;border-top:1vmin solid #c4b08c}
.pcar{position:absolute;z-index:3}
.pcar svg{width:100%;display:block}
.pcar [data-p]{cursor:pointer;transition:fill .25s}
#pal{position:absolute;left:50%;bottom:4vmin;transform:translateX(-50%);display:flex;gap:2.5vmin;z-index:5;background:rgba(255,255,255,.88);padding:2vmin 3vmin;border-radius:8vmin;box-shadow:0 1vmin 3vmin rgba(0,0,0,.15)}
.pcol{width:11vmin;height:11vmin;border-radius:50%;border:.8vmin solid #fff;box-shadow:0 .6vmin 1vmin rgba(0,0,0,.25);cursor:pointer;transition:transform .2s}
.pcol.sel{transform:scale(1.2);box-shadow:0 0 0 .8vmin #333}
/* quebra-cabeça */
#sPuz{background:linear-gradient(#bfe9ff 0,#e6f7ff 55%,#a8d98a 55%,#8cc96c 100%)}
.pzslot,.pz,.pzfull{position:absolute;z-index:2}
.pzslot svg,.pz svg,.pzfull svg{width:100%;display:block;pointer-events:none}
.pzslot{filter:brightness(0);opacity:.16;transition:opacity .2s}
.pzslot.hl{opacity:.4;animation:slotpulse .8s ease-in-out infinite}
@keyframes slotpulse{50%{opacity:.22}}
.pz{z-index:4;cursor:grab}
.pz.held{z-index:10}
.pz.done{z-index:3;pointer-events:none}
.pz *,.pzslot *{animation-play-state:paused!important}
.pzfull{z-index:5}
.pzfull:not(.moving) *{animation-play-state:paused!important}
.pzfull.moving svg{animation:bob .3s ease-in-out infinite alternate}
</style>
</head>
<body>
<div id="sObra" class="scene">
<div class="sun"></div>
<div class="cloud" style="top:10%;animation-duration:70s;animation-delay:-20s"></div>
<div class="cloud" style="top:22%;animation-duration:95s;animation-delay:-60s;transform:scale(.7)"></div>

<svg id="crane" viewBox="0 0 200 300">
  <rect x="120" y="40" width="20" height="260" fill="#ffc61a" stroke="#c99700" stroke-width="3"/>
  <polyline points="120,60 140,80 120,100 140,120 120,140 140,160 120,180 140,200 120,220 140,240 120,260 140,280 120,300" fill="none" stroke="#c99700" stroke-width="3"/>
  <rect x="5" y="36" width="190" height="12" fill="#ffc61a" stroke="#c99700" stroke-width="3"/>
  <rect x="160" y="48" width="32" height="20" fill="#777"/>
  <rect x="112" y="50" width="34" height="24" rx="3" fill="#ffc61a" stroke="#c99700" stroke-width="3"/>
  <rect x="117" y="55" width="14" height="10" fill="#9fdcff"/>
  <g class="hook"><line x1="40" y1="48" x2="40" y2="150" stroke="#444" stroke-width="2.5"/><path d="M33 150 h14 v8 q0 12 -8 12 q-6 0 -6 -6" fill="none" stroke="#444" stroke-width="4"/></g>
</svg>

<div id="ground"></div>
<div id="road"></div>

<div id="site">
  <svg id="mixer" viewBox="0 0 200 210">
    <path d="M100 120 L55 188 M100 120 L145 188" stroke="#2c5aa0" stroke-width="10" stroke-linecap="round"/>
    <rect x="18" y="104" width="42" height="30" rx="6" fill="#2c5aa0"/><rect x="24" y="110" width="30" height="5" fill="#5d8fd6"/><rect x="24" y="120" width="30" height="5" fill="#5d8fd6"/>
    <path d="M60 118 H140" stroke="#2c5aa0" stroke-width="12" stroke-linecap="round"/>
    <g class="wheel"><circle cx="55" cy="192" r="15" fill="#222"/><circle cx="55" cy="192" r="6" fill="#bbb"/><rect x="53" y="179" width="4" height="26" fill="#555"/></g>
    <g class="wheel"><circle cx="145" cy="192" r="15" fill="#222"/><circle cx="145" cy="192" r="6" fill="#bbb"/><rect x="143" y="179" width="4" height="26" fill="#555"/></g>
    <g id="drum">
      <clipPath id="mclip"><path d="M62 60 L138 60 L160 105 Q160 150 100 150 Q40 150 40 105 Z"/></clipPath>
      <path d="M62 60 L138 60 L160 105 Q160 150 100 150 Q40 150 40 105 Z" fill="#ff8c1a"/>

// ================= som =================
let ac,master,nbuf;
function initAudio(){
  try{
    if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.8;const cp=ac.createDynamicsCompressor();cp.threshold.value=-12;cp.ratio.value=6;master.connect(cp).connect(ac.destination);}
    if(ac.state==='suspended') ac.resume();
  }catch(e){}
}
function tone(f,dur,type,vol,when,slide){
  if(!ac) return; const t=ac.currentTime+(when||0);
  const o=ac.createOscillator(),g=ac.createGain(); o.type=type||'sine';
  o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol||.2,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(master); o.start(t); o.stop(t+dur+.05);
}
function buf(){if(!nbuf){nbuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}return nbuf;}
function noise(dur,vol,freq,q,when){
  if(!ac) return;
  const t=ac.currentTime+(when||0); const s=ac.createBufferSource(); s.buffer=buf();
  const f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=q||1;
  const g=ac.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(master); s.start(t); s.stop(t+dur+.05);
}
function hiss(dur,vol,freq,q){
  if(!ac) return;
  const t=ac.currentTime; const src=ac.createBufferSource(); src.buffer=buf(); src.loop=true;
  const f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=q||1;
  const g=ac.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.15); g.gain.setValueAtTime(vol,t+dur-.3); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  src.connect(f).connect(g).connect(master); src.start(t); src.stop(t+dur+.05);
}
function rumble(dur,vol){
  if(!ac) return; const t=ac.currentTime;
  const o=ac.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(46,t); o.frequency.linearRampToValueAtTime(58,t+dur*.5); o.frequency.linearRampToValueAtTime(46,t+dur);
  const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=280;
  const g=ac.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.15); g.gain.setValueAtTime(vol,t+dur-.4); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  const l=ac.createOscillator(); l.frequency.value=9; const lg=ac.createGain(); lg.gain.value=vol*.5; l.connect(lg).connect(g.gain);
  o.connect(f).connect(g).connect(master); o.start(t); l.start(t); o.stop(t+dur); l.stop(t+dur);
}
const POUR={
  'Cimento!'(d){hiss(d,.3,800,.6);},
  'Areia!'(d){hiss(d,.28,3200,.7);hiss(d,.12,1800,.7);},
  'Água!'(d){hiss(d,.32,550,.5);for(let i=0;i<10;i++)tone(300+Math.random()*500,.08,'sine',.12,Math.random()*d*.9,900+Math.random()*400);},
  'Brita!'(d){for(let w=0;w<d-.1;w+=.09+Math.random()*.08)noise(.07,.55,1200+Math.random()*1500,5,w);}
};
const SND={
  pop(){tone(420,.15,'sine',.25,0,900);},
  grab(){tone(300,.12,'triangle',.25,0,700);tone(700,.1,'triangle',.15,.08,1100);},
  boing(){tone(500,.35,'sine',.25,0,180);tone(260,.3,'triangle',.12,.1,520);},
  thud(){noise(.25,.6,180,1);tone(120,.2,'sine',.3,0,60);},
  sand(){noise(.35,.35,3500,.8);noise(.3,.25,2500,.8,.08);},
  water(){tone(500,.12,'sine',.25,0,1100);tone(400,.14,'sine',.2,.1,900);},
  rock(){[0,.07,.15].forEach(w=>{noise(.06,.6,1800,6,w);});},
  bloop(){tone(380,.25,'sine',.3,0,110);noise(.2,.25,600,1.2,.05);},
  horn(){
    if(!ac) return; const t0=ac.currentTime;
    const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1800; f.connect(master);
    [[0,.16],[.24,.38]].forEach(([a,d])=>{
      [415,523].forEach(fr=>{const o=ac.createOscillator(),g=ac.createGain(); o.type='square'; o.frequency.value=fr;
        g.gain.setValueAtTime(.0001,t0+a); g.gain.exponentialRampToValueAtTime(.09,t0+a+.015); g.gain.setValueAtTime(.09,t0+a+d-.03); g.gain.exponentialRampToValueAtTime(.0001,t0+a+d);
        o.connect(g).connect(f); o.start(t0+a); o.stop(t0+a+d+.02);});
    });
  },
  beep(){[0,.4,.8,1.2].forEach(w=>tone(1000,.2,'square',.05,w));},
  fanfare(){[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.22,i*.13));tone(1047,.5,'triangle',.2,.55);},
  splash(){noise(1.2,.35,700,.7);noise(.9,.2,1500,.7,.2);}
};
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices();}catch(e){}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}
function say(t){
  try{
    const s=window.speechSynthesis; if(!s) return; s.cancel();
    const u=new SpeechSynthesisUtterance(t); u.lang='pt-BR'; u.rate=1; u.pitch=1.3; u.volume=1;
    const v=voices.find(v=>/^pt[-_]BR/i.test(v.lang))||voices.find(v=>/^pt/i.test(v.lang)); if(v) u.voice=v;
    s.speak(u);
  }catch(e){}
}

// ================= cena comum =================
const $=id=>document.getElementById(id);
const mixer=$('mixer'),drum=$('drum'),mstripes=$('mstripes'),mlevel=$('mlevel'),barrow=$('barrow'),heap=$('heap'),fx=$('fx'),prog=$('prog'),menu=$('menu'),home=$('home');
let mode=null,gen=0,NEED=8,count=0,pouring=false,machines=0,rounds=0,spinT,heapT;
const vm=()=>Math.min(innerWidth,innerHeight)/100;
function later(fn,ms){const g=gen;return setTimeout(()=>{if(g===gen)fn();},ms);}
function pt(svg,vx,vy,vw,vh){const r=svg.getBoundingClientRect();return{x:r.left+r.width*vx/vw,y:r.top+r.height*vy/vh};}
const mouth=()=>pt(mixer,100,62,200,210);
function spin(fast){clearTimeout(spinT);mstripes.style.animationDuration=fast?'.3s':'1.6s';}

function buildProg(){prog.innerHTML='';for(let i=0;i<NEED;i++)prog.appendChild(document.createElement('span'));}
function clearProg(){[...prog.children].forEach(d=>{d.style.background='';d.classList.remove('on');});}

function makeItem(it,x,y){
  const el=document.createElement('div'); el.className='item';
  el.innerHTML='<div class="ring"></div><div class="bob">'+it.svg+'</div>';
  el.style.left=x+'px'; el.style.top=y+'px'; document.body.appendChild(el);
  return el;
}

// leva o item até a boca, vira e despeja
function pourItem(o,done){
  const g=gen,s=o.el.offsetWidth,m=mouth();
  const cx=m.x-.33*s,cy=m.y-.95*s,tx=cx-o.x,ty=cy-o.y;
  o.el.querySelector('.bob').style.animation='none';
  const go=o.el.animate([
    {transform:'translate(0,0) rotate(0deg)'},
    {transform:`translate(${tx}px,${ty}px) rotate(0deg)`,offset:.6},
    {transform:`translate(${tx}px,${ty}px) rotate(130deg)`}
  ],{duration:o.fast?900:1400,easing:'ease-in-out',fill:'forwards'});
  go.onfinish=()=>{
    if(g!==gen) return;
    const ang=130*Math.PI/180,sx=cx+Math.sin(ang)*.36*s,sy=cy-Math.cos(ang)*.36*s;
    const D=2.2; spin(true); POUR[o.it.name](D); rumble(D,.1);
    stream(o.it.name,sx,sy,m.x,m.y,D*1000,mixer.getBoundingClientRect().width*.28);
    later(()=>{
      o.el.animate([
        {transform:`translate(${tx}px,${ty}px) rotate(130deg)`,opacity:1},
        {transform:`translate(${tx-60}px,${ty-140}px) rotate(0deg) scale(.4)`,opacity:0}
      ],{duration:600,easing:'ease-in',fill:'forwards'}).onfinish=()=>{o.el.remove();};
      hitMixer(o.it.name); done&&done();
    },D*1000+150);
  };
}

function stream(name,sx,sy,mx,my,dur,spread){
  const st=STREAM[name],v=vm(),t0=performance.now(),g=gen;
  const iv=setInterval(()=>{
    if(g!==gen||performance.now()-t0>dur){clearInterval(iv);return;}
    for(let k=0;k<st.n;k++){
      const p=document.createElement('div'); p.className='particle';
      const z=(st.sz[0]+Math.random()*(st.sz[1]-st.sz[0]))*v;
      p.style.width=p.style.height=z+'px'; p.style.background=st.c[Math.floor(Math.random()*st.c.length)];
      p.style.left=(sx+(Math.random()-.5)*z*1.5-z/2)+'px'; p.style.top=(sy-z/2)+'px';
      document.body.appendChild(p);
      p.animate([{transform:'translate(0,0)'},{transform:`translate(${mx-sx+(Math.random()-.5)*spread}px,${my-sy}px)`}],
        {duration:380+Math.random()*160,easing:'cubic-bezier(.45,0,1,1)'}).onfinish=()=>p.remove();
    }
  },name==='Brita!'?80:30);
}

function hitMixer(name){
  SND.bloop();
  mixer.animate([{transform:'scale(1)'},{transform:'scale(1.06,.94)'},{transform:'scale(.97,1.03)'},{transform:'scale(1)'}],{duration:350});

  o.f.forEach(([tt,fr],i)=>{if(i===0)osc.frequency.setValueAtTime(fr,t);else osc.frequency.linearRampToValueAtTime(fr,t+tt*d);});
  if(o.vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=o.vib[0];lg.gain.value=o.vib[1];l.connect(lg).connect(osc.frequency);l.start(t);l.stop(t+d);}
  const g=ac.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+Math.min(.05,d*.2)); g.gain.setValueAtTime(v,t+d*.7); g.gain.exponentialRampToValueAtTime(.0001,t+d);

}

function tapAnimal(d,e,n,snd){
  if(aLock||bigOpen) return; aLock=true; bigOpen=true; closeOK=false;
  const r=d.getBoundingClientRect(),dx=r.left+r.width/2-innerWidth/2,dy=r.top+r.height/2-innerHeight/2;

  bigE.textContent=e; bigN.textContent=n.toUpperCase(); big.style.display='flex';
  big.animate([{opacity:0},{opacity:1}],{duration:250});
  bigE.animate([{transform:`translate(${dx}px,${dy}px) scale(.2)`},{transform:'translate(0,0) scale(1.15)',offset:.7},{transform:'translate(0,0) scale(1)'}],{duration:600,easing:'ease-out'});
  bigN.animate([{opacity:0,transform:'translateY(5vmin)'},{opacity:0,offset:.5},{opacity:1,transform:'translateY(0)'}],{duration:800,easing:'ease-out'});
  SND.pop();
  later(()=>{const dur=ASND[snd]();bigE.animate([{transform:'scale(1) rotate(0)'},{transform:'scale(1.08) rotate(-6deg)'},{transform:'scale(1) rotate(6deg)'},{transform:'scale(1.05) rotate(-3deg)'},{transform:'scale(1) rotate(0)'}],{duration:Math.max(600,dur*1000),easing:'ease-in-out'});later(()=>say(n+'!'),dur*1000+250);},350);
  later(()=>closeOK=true,1500);
  clearTimeout(bigT); bigT=later(closeBig,5200);
  if(!d.classList.contains('found')){
    d.classList.add('found'); found++;
    const t=[...atrack.children].find(x=>x.dataset.n===n); if(t){t.classList.remove('nf');t.classList.add('ok');}
    if(found===SCENES[sceneIdx].animals.length) allDone=true;
  }
}

function tween(dur,fn,ease){return new Promise(res=>{const t0=performance.now(),g=gen;const st=now=>{if(g!==gen)return res(false);const k=Math.min(1,(now-t0)/dur);const e=ease?ease(k):(k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2);fn(e);if(k<1)requestAnimationFrame(st);else res(true);};requestAnimationFrame(st);});}
function vbRatio(svgStr){const m=svgStr.match(/viewBox="([^"]+)"/);const p=m[1].split(/\s+/).map(Number);return p[3]/p[2];}

function waterOn(){if(!ac||waterSrc)return;const s=ac.createBufferSource();s.buffer=buf();s.loop=true;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1300;f.Q.value=.6;const g=ac.createGain();g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.22,ac.currentTime+.12);s.connect(f).connect(g).connect(master);s.start();waterSrc=s;waterGain=g;}
function waterOff(){if(!waterSrc)return;const s=waterSrc,g=waterGain;waterSrc=null;try{g.gain.cancelScheduledValues(ac.currentTime);g.gain.setValueAtTime(g.gain.value,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.2);s.stop(ac.currentTime+.25);}catch(e){}}
